<form (ngSubmit)="onSubmit()" id="new-ticket" #form>
    <app-control label="Title">
        <input name="title" id="title" #titleInput #input [(ngModel)]="enteredTitle" />
    </app-control>
    <app-control label="Request">
        <textarea name="request" id="request" rows="3" #textAreaInput #input [(ngModel)]="enteredText"></textarea>
    </app-control>
    <div>
        <button appButton>
            Submit
            <span ngProjectAs="icon">⌲</span>
        </button>
    </div>
</form>
